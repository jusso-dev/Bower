spring.application.name=spring-example
# The BowerRequestFilter applies TRUSTED_PROXIES itself; don't let Tomcat rewrite the peer.
server.forward-headers-strategy=none
# JSON application logs (Spring Boot 3.4+), UTC timestamps. Security events go to Bower.
logging.structured.format.console=ecs
server.error.include-stacktrace=never
server.error.include-message=never
