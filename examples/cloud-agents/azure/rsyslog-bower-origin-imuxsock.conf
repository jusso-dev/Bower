# /etc/rsyslog.d/09-bower-origin.conf (Debian and Ubuntu, imuxsock input)
# Discard any message carrying a Bower envelope unless the kernel says the bower account sent
# it. Needs trusted properties on the system socket: in /etc/rsyslog.conf change
#   module(load="imuxsock")
# to
#   module(load="imuxsock" SysSock.Annotate="on" SysSock.ParseTrusted="on")
# Replace 999 below with the output of: id -u bower
# $!uid comes from the socket credentials journald passes on when it forwards (it was the
# sender's account in this test, not journald's). Root can still forge. This narrows who can
# write rows to BowerSecurity_CL from "any local account" to "root and the bower account".
# Sorts before 10-azuremonitoragent-omfwd.conf, the file Azure Monitor Agent writes
# (https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-syslog).
#
# Tested 10-11-2026 on Debian 12 (rsyslog 8.2302, imuxsock, systemd 252), with a stand-in for
# the agent's file forwarding to a local TCP listener:
#   50 from bower.service (User=bower, packaged sandbox): 50 forwarded.
#   50 from another unit under another account, same tag and format: 0 forwarded.
#   5 from root: 0 forwarded.
#   ordinary local4 and user messages: still forwarded and written to /var/log/syslog.
#   Without this file: all 50 forged messages were forwarded.
# Live 10-11-2026 on Ubuntu 24.04 (rsyslog 8.2312, imuxsock) beside the real
# 10-azuremonitoragent-omfwd.conf written by Azure Monitor Agent 1.45.1, checked in
# BowerSecurity_CL: 20 of 20 from bower.service arrived; 0 of 20 sent with logger as nobody and
# 0 of 5 sent by root. The packaged bower account was uid 995 there, not 999: replace the number
# (#249).
if ($msg contains "bower-b64:") and not ($!uid == "999" and $programname == "bower") then stop
