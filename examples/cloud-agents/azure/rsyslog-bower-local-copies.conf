# /etc/rsyslog.d/11-bower-local-copies.conf
# Stop Bower messages after Azure Monitor Agent's forward, so rsyslog does not also write
# them to /var/log/messages (RHEL family) or /var/log/syslog (Debian, Ubuntu). It must sort
# after 10-azuremonitoragent-omfwd.conf, the file the agent writes
# (https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-syslog), and
# /etc/rsyslog.d is included before the distribution's file rules. The journal copy stays:
# journald owns /dev/log.
# Hosts where the agent uses its Unix socket file (10-azuremonitoragent.conf) sort the same
# way; that variant was not tested. On Oracle Linux 9.8 with SELinux enforcing, agent 1.45.1
# still wrote the TCP file.
# Live 10-11-2026 with the real agent file (agent 1.45.1): 0 Bower lines added to
# /var/log/messages (Oracle Linux 9.8) and /var/log/syslog (Ubuntu 24.04) while 20 events per
# host reached BowerSecurity_CL (#249).
#
# Tested 10-11-2026 with a stand-in for the agent's documented omfwd file (its template and
# queue settings, target a local TCP listener on 127.0.0.1:28330):
#   Rocky Linux 9 (imjournal): 50 Bower messages forwarded, 0 in /var/log/messages.
#   Debian 12 (imuxsock): 50 forwarded, 0 in /var/log/syslog.
#   Ordinary messages still written locally on both. Without this file every Bower message
#   was also written to the local file.
if ($programname == "bower") and ($msg contains "bower-b64:") then stop
