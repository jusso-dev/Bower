# /etc/systemd/system/rsyslog.service.d/bower-socket.conf: who may write to Bower's socket.
# rsyslog's imuxsock has no option for a socket's owner or mode, so set them once rsyslog has
# created the socket (rsyslog-bower-socket.conf). Only root and the bower account can then send
# to it. Apply with: sudo systemctl daemon-reload && sudo systemctl restart rsyslog
# Tested 11-11-2026 on Rocky Linux 9 and Debian 12: see the issue #238 comment.
[Service]
ExecStartPost=/bin/sh -c 'for i in $(seq 1 50); do [ -S /run/bower/syslog.sock ] && break; sleep 0.1; done; chown root:bower /run/bower/syslog.sock && chmod 0660 /run/bower/syslog.sock'
