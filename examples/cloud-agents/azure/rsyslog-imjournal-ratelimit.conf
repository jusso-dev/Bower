# RHEL family (rsyslog reads the journal with imjournal): raise imjournal's rate limit.
# A module can be loaded only once, so this is not a file for /etc/rsyslog.d: edit the
# existing module(load="imjournal" ...) block in /etc/rsyslog.conf and add the two
# Ratelimit lines. A second module(load="imjournal") in /etc/rsyslog.d is refused
# ("module 'imjournal' already in this config"). Check with: sudo rsyslogd -N1
# then: sudo systemctl restart rsyslog
#
# The default is 20,000 messages per 600 s for the whole host (about 33 per second
# sustained). When it is reached rsyslog logs, once per interval:
#   imjournal from <host:bower>: begin to drop messages due to rate-limiting
#
# Tested 10-11-2026 on Rocky Linux 9 (rsyslog 8.2510, systemd 252) with the per-unit
# journald drop-in in place, 150,000 Bower messages in about 3 s from bower.service:
#   default: 19,988 forwarded to the local TCP listener, the drop line above logged.
#   with these lines: 150,000 forwarded, no drop line.
module(load="imjournal"             # provides access to the systemd journal
       UsePid="system" # PID nummber is retrieved as the ID of the process the journal entry originates from
       FileCreateMode="0644" # Set the access permissions for the state file
       StateFile="imjournal.state" # File to store the position in the journal
       Ratelimit.Interval="600"
       Ratelimit.Burst="200000")
