# /etc/rsyslog.d/09-bower-origin.conf (RHEL family, imjournal input)
# Discard any message carrying a Bower envelope unless journald recorded it as coming from
# bower.service. journald sets _SYSTEMD_UNIT from the sender's cgroup; the sender cannot
# choose it. Root can still forge (it can run anything as bower.service): this narrows who
# can write rows to BowerSecurity_CL from "any local account" to "root and bower.service".
# Sorts before 10-azuremonitoragent-omfwd.conf, the file Azure Monitor Agent writes
# (https://learn.microsoft.com/en-us/azure/azure-monitor/vm/data-collection-syslog), so a
# forged message is stopped before the forward. Forged messages stay in the journal.
#
# Tested 10-11-2026 on Rocky Linux 9 (rsyslog 8.2510, imjournal, systemd 252), with a stand-in
# for the agent's file forwarding to a local TCP listener:
#   50 from bower.service (User=bower, packaged sandbox): 50 forwarded.
#   50 from another unit under another account, same tag and format: 0 forwarded.
#   5 from root outside any unit: 0 forwarded.
#   ordinary local4 and user messages: still forwarded and written to /var/log/messages.
#   Without this file: all 50 forged messages were forwarded.
if ($msg contains "bower-b64:") and not ($!_SYSTEMD_UNIT == "bower.service" and $programname == "bower") then stop
