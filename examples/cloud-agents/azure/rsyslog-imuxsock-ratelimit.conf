# Debian and Ubuntu (rsyslog reads journald's forwarded messages with imuxsock).
# A module can be loaded only once, so this is not a file for /etc/rsyslog.d: replace the
# module(load="imuxsock") line in /etc/rsyslog.conf. Check: sudo rsyslogd -N1, then
# sudo systemctl restart rsyslog.
#
# imuxsock's limit is off by default (SysSock.RateLimit.Interval="0"); stock Debian 12 has no
# limit set. Only hosts where someone turned it on need this. When a limit is reached
# rsyslog logs:
#   imuxsock[pid: N, name: ...] from <host:bower>: begin to drop messages due to rate-limiting
#
# Tested 10-11-2026 on Debian 12 (rsyslog 8.2302, systemd 252), with the per-unit journald
# drop-in and net.unix.max_dgram_qlen=8192 in place:
#   Interval 5, Burst 5 (to prove the setting applies under systemd): 5 of 2,000 forwarded,
#     the drop line above logged.
#   Interval 5, Burst 200000 (these lines): 150,000 of 150,000 forwarded, no drop line.
module(load="imuxsock" SysSock.RateLimit.Interval="5" SysSock.RateLimit.Burst="200000") # provides support for local system logging
