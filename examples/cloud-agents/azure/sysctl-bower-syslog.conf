# /etc/sysctl.d/60-bower-syslog.conf
# Debian and Ubuntu (journald forwards to rsyslog's imuxsock over /run/systemd/journal/syslog).
# imuxsock does not rate-limit by default (SysSock.RateLimit.Interval is 0), so the limit
# that loses messages in a burst is the kernel's queue on that socket (512 datagrams):
# journald drops what does not fit and logs "Forwarding to syslog missed N messages."
# Apply: sudo sysctl -p /etc/sysctl.d/60-bower-syslog.conf, then recreate the socket so it
# picks the new length up: sudo systemctl restart syslog.socket rsyslog.service
#
# Tested 10-11-2026 on Debian 12 (rsyslog 8.2302, systemd 252) with the per-unit journald
# drop-in in place, 150,000 Bower messages in about 1.5 s from bower.service:
#   default (512): 149,529 to 149,830 forwarded to the local TCP listener (three runs).
#   with 8192: 150,000 forwarded in each of two runs, no "missed" line.
# Paced at 5,000 per second, 150,000 of 150,000 arrived with the default.
net.unix.max_dgram_qlen = 8192
