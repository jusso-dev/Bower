# /etc/systemd/system/bower.service.d/syslog-output.conf
# Raises journald's rate limit for bower.service only (BOWER_OUTPUT=syslog). Other services
# keep the host default. Apply with: sudo systemctl daemon-reload && sudo systemctl restart bower
#
# Tested 10-11-2026 in containers booted with systemd, a stand-in sender running as
# bower.service with the packaged sandbox settings, 150,000 messages in about 1.5 s:
#   Rocky Linux 9 (systemd 252), default limit: journald kept 32,500; with this file: 150,000.
#   Debian 12 (systemd 252), default limit: journald kept 37,500; with this file: 150,000.
# journald scales the burst by free disk space, so the effective default varies by host.
# Size the burst as peak events per second times the interval, with headroom.
[Service]
LogRateLimitIntervalSec=30s
LogRateLimitBurst=50000
