# /etc/rsyslog.d/05-bower-socket.conf: a socket only Bower writes to, read by rsyslog directly.
# Then set BOWER_AMA_SYSLOG_SOCKET=/run/bower/syslog.sock in /etc/bower/bower.env.
#
# Bower's events then skip journald:
#   - no journal copy of every event (see "What stays on the server");
#   - no journald rate limit, so the per-unit drop-in is not needed;
#   - on Debian and Ubuntu, no journald forward to rsyslog, which drops messages in a burst.
# rsyslog's own limits still apply: the input's rate limit is off below, and MaxMessageSize
# still cuts forwarded lines at 8,096 characters by default.
#
# The socket is owned by root:bower and mode 0660, so only root and the bower account can write
# to it. That is the same boundary as the origin filter, without needing it for this input.
# /dev/log stays as it is for everything else on the host.
#
# Order: before 10-azuremonitoragent-omfwd.conf, so the agent's forward sees these messages.
# Keep 11-bower-local-copies.conf to keep them out of /var/log/messages and /var/log/syslog.
#
# Tested 11-11-2026 in Rocky Linux 9 (rsyslog 8.2510) and Debian 12 (rsyslog 8.2302) systemd
# containers, with the CI-built collector package and rsyslog-bower-socket-permissions.conf:
#   the socket was root:bower 0660; bower could send, nobody was refused;
#   20,000 of 20,000 events posted to Bower reached the forward, with 0 in the journal and 0 in
#   /var/log/messages or /var/log/syslog, and no rsyslog drop, rate-limit or error lines.
#
# Both distributions already load imuxsock in /etc/rsyslog.conf, and loading it twice is an
# error, so this file has only the input. Add module(load="imuxsock") here only if rsyslog.conf
# doesn't load it.
input(type="imuxsock"
      Socket="/run/bower/syslog.sock"
      CreatePath="on"
      RateLimit.Interval="0"
      UseSysTimeStamp="on"
      Annotate="on"
      ParseTrusted="on")
