requirements:
  requiredFields:
    - timeGenerated
    - eventType
    - eventAction
    - eventResult
    - application.name
    - target.type
  atLeastOne:
    - actor.username
    - actor.userId
  recommendedFields:
    - source.ipAddress
    - target.name
    - eventOutcomeReason

decision:
  action: accept
  minimumValueScore: 70
  neverSample: true

routing:
  profile: cloud-control-plane
  destination: security-events
