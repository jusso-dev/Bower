title: Google Cloud service account key created
id: bower-pack-gcp-sa-key-created-001
status: stable
description: A user-managed service account key was created or uploaded; keys are long-lived credentials.
version: 1.0.0
level: high
logsource:
  product: bower
  service: gcp_cloud_audit
detection:
  selection:
    EventType: gcp_cloud_audit
    EventAction:
      - CreateServiceAccountKey
      - UploadServiceAccountKey
    EventResult: Success
  condition: selection
tags:
  - attack.t1098.001
  - attack.persistence
falsepositives:
  - Approved integrations that cannot use Workload Identity Federation
