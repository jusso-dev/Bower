# ASVS 5.0 V16.3.3 (bypass attempts: input validation, business logic, anti-automation),
# V2.4.1, V6.3.1, V6.6.3, V6.6.4. High volume by nature: suppressed per client address and
# application, so a flood becomes counted summaries instead of a bill.
apiVersion: bower.security/v1
kind: TelemetryPolicy
metadata:
  id: BWR-PACK-ASVS-CONTROL-BYPASS
  name: Validation failures and anti-automation hits
  version: 1.0.0
  owner: Security Operations
  reviewDate: 2027-11-01
match:
  eventCategories: [application-security, api-security]
  eventTypes: [input_validation_failure, business_logic_violation, anti_automation_triggered]
  eventResults: [denied, failure]
requirements:
  requiredFields: [timeGenerated, eventType, eventAction, eventResult, application.name, request.correlationId]
  atLeastOne: [source.ipAddress, actor.userId, actor.username]
  recommendedFields: [labels.route, request.method, eventOutcomeReason, labels.userAgent]
decision:
  action: accept
  minimumValueScore: 70
  neverSample: false
suppression:
  keyFields: [application.name, eventType, source.ipAddress]
  windowSeconds: 60
  allowPerWindow: 20
routing:
  profile: application-security
  destination: security-events
