# ISM-1537 database event logging; ASVS 5.0 V16.3.2, V16.3.3. Normalised audit records from
# pgaudit, MySQL audit plugins, SQL Server Audit, MongoDB auditing or Cosmos DB diagnostics.
apiVersion: bower.security/v1
kind: TelemetryPolicy
metadata:
  id: BWR-PACK-ASVS-DB-AUDIT
  name: Database audit events
  version: 1.0.0
  owner: Security Operations
  reviewDate: 2027-11-01
match:
  eventCategories: [data-access, administrative-activity, authentication]
  eventTypes: [database_audit]
  eventActions: [db.logon, db.logoff, db.logon_failure, db.ddl, db.dcl, db.privileged, db.sensitive_read, db.sensitive_write, db.query_error, db.audit_config]
requirements:
  requiredFields: [timeGenerated, eventType, eventAction, eventResult, application.name, target.type, labels.dbEngine]
  atLeastOne: [actor.username, actor.userId]
  recommendedFields: [target.name, source.ipAddress, labels.dbStatementClass, eventOutcomeReason]
decision:
  action: accept
  minimumValueScore: 75
  neverSample: true
routing:
  profile: database
  destination: security-events
