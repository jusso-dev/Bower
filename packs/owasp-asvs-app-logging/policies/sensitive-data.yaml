# ASVS 5.0 V16.3.2 (L3: sensitive data access, without the data itself), V14.2.4: reads,
# creates, updates and deletes of classified records. Exports stay with BWR-POL-SENSITIVE-EXPORT.
apiVersion: bower.security/v1
kind: TelemetryPolicy
metadata:
  id: BWR-PACK-ASVS-SENSITIVE-DATA
  name: Sensitive record access and changes
  version: 1.0.0
  owner: Security Operations
  reviewDate: 2027-11-01
match:
  eventCategories: [data-access]
  eventTypes: [sensitive_data_accessed, sensitive_record_changed]
  eventActions: [data.read, data.create, data.update, data.delete]
requirements:
  requiredFields: [timeGenerated, eventType, eventAction, eventResult, application.name, request.correlationId, actor.userId, target.type, target.id, labels.dataClassification]
  recommendedFields: [attributes.recordCount, labels.route, source.ipAddress]
decision:
  action: accept
  minimumValueScore: 80
  neverSample: true
routing:
  profile: application-security
  destination: security-events
