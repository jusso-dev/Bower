# Required by BWR-PACK-ASVS-CONTROL-BYPASS: accepts the counted summaries of suppressed events.
apiVersion: bower.security/v1
kind: TelemetryPolicy
metadata:
  id: BWR-PACK-ASVS-SUPPRESSION-SUMMARY
  name: Suppression summaries for the ASVS pack
  version: 1.0.0
  owner: Security Operations
  reviewDate: 2027-11-01
match:
  eventTypes: [telemetry_aggregation_summary]
  eventActions: [telemetry.suppressed]
requirements:
  requiredFields: [timeGenerated, eventType, application.name, target.id]
decision:
  action: accept
  minimumValueScore: 50
  neverSample: true
routing:
  profile: application-security
  destination: security-events
