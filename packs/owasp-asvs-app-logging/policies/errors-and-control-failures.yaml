# ASVS 5.0 V16.3.4 (unexpected errors, security control failures such as backend TLS),
# V16.5.2, V16.5.3, V16.5.4 (last-resort handler). Never the stack trace or message text.
apiVersion: bower.security/v1
kind: TelemetryPolicy
metadata:
  id: BWR-PACK-ASVS-ERRORS
  name: Unexpected errors and security control failures
  version: 1.0.0
  owner: Security Operations
  reviewDate: 2027-11-01
match:
  eventCategories: [application-security]
  eventTypes: [application_error, security_control_failure]
  eventResults: [failure]
requirements:
  requiredFields: [timeGenerated, eventType, eventAction, eventResult, application.name, request.correlationId, eventOutcomeReason]
  recommendedFields: [labels.route, request.statusCode, labels.errorType, eventSeverity, request.traceId]
decision:
  action: accept
  minimumValueScore: 70
  neverSample: true
routing:
  profile: application-security
  destination: security-events
