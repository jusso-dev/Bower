# ASVS 5.0 V16.3.2, V8.2.1 (function), V8.2.2 (object, IDOR/BOLA), V8.2.3 (field, BOPLA),
# V8.3.2 (action by a consumer no longer authorised).
apiVersion: bower.security/v1
kind: TelemetryPolicy
metadata:
  id: BWR-PACK-ASVS-AUTHZ-FAILURE
  name: Authorisation failures
  version: 1.0.0
  owner: Security Operations
  reviewDate: 2027-11-01
match:
  eventCategories: [authorisation]
  eventTypes: [authorisation_failure]
  eventActions: [authz.function, authz.object, authz.field, authz.stale_grant]
  eventResults: [denied, failure]
requirements:
  requiredFields: [timeGenerated, eventType, eventAction, eventResult, application.name, request.correlationId, target.type]
  atLeastOne: [actor.userId, actor.username, source.ipAddress]
  recommendedFields: [labels.route, request.method, actor.role, target.id, labels.requiredPermission]
decision:
  action: accept
  minimumValueScore: 75
  neverSample: true
routing:
  profile: application-security
  destination: security-events
