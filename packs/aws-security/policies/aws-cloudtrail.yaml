apiVersion: bower.security/v1
kind: TelemetryPolicy

metadata:
  id: BWR-POL-AWS-CLOUDTRAIL
  name: High-value AWS CloudTrail activity
  version: 1.1.0
  owner: Security Operations
  reviewDate: 2027-06-30

match:
  eventCategories:
    - administrative-activity
    - authentication
  eventTypes:
    - aws_cloudtrail

  eventActions:
    - AddUserToGroup
    - AppLogs
    - AttachGroupPolicy
    - AttachRolePolicy
    - AttachUserPolicy
    - AuthorizeSecurityGroupIngress
    - ConsoleLogin
    - CreateAccessKey
    - CreateLoginProfile
    - CreateOpenIDConnectProvider
    - CreatePolicyVersion
    - CreateRole
    - CreateSAMLProvider
    - CreateUser
    - DeactivateMFADevice
    - DeleteConfigurationRecorder
    - DeleteDeliveryChannel
    - DeleteDetector
    - DeletePublicAccessBlock
    - DeleteTrail
    - DeleteUser
    - DeleteVirtualMFADevice
    - DisableKey
    - DisableSecurityHub
    - DisassociateFromAdministratorAccount
    - DisassociateFromMasterAccount
    - LeaveOrganization
    - ModifySnapshotAttribute
    - PutBucketAcl
    - PutBucketPolicy
    - PutEventSelectors
    - PutGroupPolicy
    - PutKeyPolicy
    - PutRolePolicy
    - PutUserPolicy
    - ScheduleKeyDeletion
    - SetDefaultPolicyVersion
    - StopConfigurationRecorder
    - StopLogging
    - UpdateAssumeRolePolicy
    - UpdateDetector
    - UpdateLoginProfile
    - UpdateSAMLProvider
    - UpdateTrail

requirements:
  requiredFields:
    - timeGenerated
    - eventType
    - eventAction
    - eventResult
    - application.name
    - target.name
  atLeastOne:
    - actor.username
    - actor.userId
  recommendedFields:
    - source.ipAddress
    - eventOutcomeReason

decision:
  action: accept
  minimumValueScore: 70
  neverSample: true

routing:
  profile: cloud-control-plane
  destination: security-events
