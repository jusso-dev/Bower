title: AWS console sign-in failure
id: bower-pack-aws-console-login-failure-001
status: stable
description: A failed AWS Management Console sign-in.
version: 1.0.0
level: medium
logsource:
  product: bower
  service: aws_cloudtrail
detection:
  selection:
    EventType: aws_cloudtrail
    EventAction: ConsoleLogin
    EventResult: Failure
  condition: selection
tags:
  - attack.t1110
  - attack.credential_access
falsepositives:
  - Users mistyping passwords
