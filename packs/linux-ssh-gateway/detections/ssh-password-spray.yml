title: SSH sign-in failure from gateway
id: bower-pack-ssh-auth-failure-001
status: stable
description: SSH or PAM sign-in failure forwarded from a Linux host or container.
version: 1.0.0
level: medium
logsource:
  product: bower
  service: authentication
detection:
  selection:
    EventType: authentication_failure
    EventResult: Failure
  condition: selection
tags:
  - attack.t1110
  - attack.credential_access
falsepositives:
  - Users mistyping passwords
