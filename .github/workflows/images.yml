name: Images

# Publishes multi-architecture container images to GitHub Container Registry.
#   main (after CI passes)  -> :edge and :sha-<short>
#   tag vX.Y.Z               -> :X.Y.Z, :X.Y and :latest
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Only publish main builds whose CI run succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bower-collector
            dockerfile: deploy/docker/Dockerfile
            description: Bower collector - redacts, policy-checks and durably delivers security events
          - image: bower-management
            dockerfile: deploy/docker/Dockerfile.management
            description: Bower management API with the bundled console
          - image: bower-web
            dockerfile: deploy/docker/Dockerfile.web
            description: Bower management console (static, runtime-configured nginx)
          - image: bower-sidecar
            dockerfile: deploy/docker/Dockerfile.sidecar
            description: Bower Docker sidecar - forwards opted-in container security events
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run runs on the default branch; build exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Derive sha and tag values from the checked-out commit, not the event.
          context: git
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
