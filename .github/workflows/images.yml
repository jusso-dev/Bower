name: Images

# Build/push multi-architecture images only for releases or explicit dispatch.
# Ordinary merges validate source; they do not rebuild all six images again.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Manual publication must be reachable from main; release tags are explicit.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify commit is on main or is a release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Release tag $REF at $SHA"
            exit 0
          fi
          # "identical" or "behind" means SHA is main's head or one of its ancestors.
          # A commit that only exists in a fork makes the API fail, which fails closed.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)
          case "$status" in
            identical|behind) echo "$SHA is reachable from main" ;;
            *) echo "::error::$SHA is not reachable from main (compare status: $status)"; exit 1 ;;
          esac

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bower-collector
            dockerfile: deploy/docker/Dockerfile
            description: Bower collector - redacts, policy-checks and durably delivers security events
          - image: bower-management
            dockerfile: deploy/docker/Dockerfile.management
            description: Bower management API with the bundled console
          - image: bower-web
            dockerfile: deploy/docker/Dockerfile.web
            description: Bower management console (static, runtime-configured nginx)
          - image: bower-sidecar
            dockerfile: deploy/docker/Dockerfile.sidecar
            description: Bower Docker sidecar - forwards opted-in container security events
          - image: bower-cloud
            dockerfile: deploy/docker/Dockerfile.cloud
            description: Bower cloud agent - forwards AWS SQS and Google Pub/Sub security telemetry
          - image: bower-collector-rs
            dockerfile: rust/Dockerfile
            description: Bower collector (Rust) - same contract as bower-collector, static musl binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Build the exact requested revision.
          ref: ${{ github.sha }}

      - id: commit
        # Tag images with the commit actually built.
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
