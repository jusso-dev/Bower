name: Images

# Publishes multi-architecture container images to GitHub Container Registry.
#   main (after CI passes)  -> :edge and :sha-<short>
#   tag vX.Y.Z               -> :X.Y.Z, :X.Y and :latest
on:
  # workflow_run is the only way to publish after CI passes without duplicating CI here.
  # It is safe because the gate job below only accepts push runs of this repository's
  # own main branch whose commit is reachable from main; fork PR runs are skipped.
  workflow_run: # zizmor: ignore[dangerous-triggers] gated on event, head repository and reachability from main
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Only publish commits that are on main or carry a release tag.
    # The workflow_run `branches` filter matches the head branch *name*, so a fork PR
    # from a branch called `main` also matches it. Require a successful CI run that was
    # triggered by a push to this repository's own main branch.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify commit is on main or is a release tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$EVENT" != workflow_run && "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Release tag $REF at $SHA"
            exit 0
          fi
          # "identical" or "behind" means SHA is main's head or one of its ancestors.
          # A commit that only exists in a fork makes the API fail, which fails closed.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)
          case "$status" in
            identical|behind) echo "$SHA is reachable from main" ;;
            *) echo "::error::$SHA is not reachable from main (compare status: $status)"; exit 1 ;;
          esac

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bower-collector
            dockerfile: deploy/docker/Dockerfile
            description: Bower collector - redacts, policy-checks and durably delivers security events
          - image: bower-management
            dockerfile: deploy/docker/Dockerfile.management
            description: Bower management API with the bundled console
          - image: bower-web
            dockerfile: deploy/docker/Dockerfile.web
            description: Bower management console (static, runtime-configured nginx)
          - image: bower-sidecar
            dockerfile: deploy/docker/Dockerfile.sidecar
            description: Bower Docker sidecar - forwards opted-in container security events
          - image: bower-cloud
            dockerfile: deploy/docker/Dockerfile.cloud
            description: Bower cloud agent - forwards AWS SQS and Google Pub/Sub security telemetry
          - image: bower-collector-rs
            dockerfile: rust/Dockerfile
            description: Bower collector (Rust) - same contract as bower-collector, static musl binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # workflow_run runs on the default branch; build exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: commit
        # Tag images with the commit actually built (workflow_run checks out a detached SHA).
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
