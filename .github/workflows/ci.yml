name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    # Static analysis of the workflows themselves (unpinned actions, injection,
    # dangerous triggers). Fails on high-severity zizmor findings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Lint workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Audit workflows with zizmor
        env:
          # Read-only token enables zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.31.1 --format github --min-severity high .github/workflows

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Bower.sln --locked-mode
      - run: dotnet build Bower.sln --configuration Release --no-restore
      - run: dotnet test --solution Bower.sln --configuration Release --no-build
      # Every pack builds (samples and field assertions gate signing) and passes `pack test`.
      # The key is ephemeral: CI proves the packs, it never publishes a signed pack.
      - name: Test every pack
        run: |
          bower=src/Bower.Cli/bin/Release/net10.0/bower
          "$bower" keys generate --out-dir "$RUNNER_TEMP/pack-keys" --name ci-ephemeral
          mkdir -p "$RUNNER_TEMP/pack-reports"
          for source in packs/*/; do
            source=${source%/}
            id=$(basename "$source")
            "$bower" pack build "$source" --key "$RUNNER_TEMP/pack-keys/ci-ephemeral.key.pem" --out "$RUNNER_TEMP/packs/$id"
            "$bower" pack test "$RUNNER_TEMP/packs/$id/$id-"*.bowerpack --trusted-key "$RUNNER_TEMP/pack-keys/ci-ephemeral.pub.pem" \
              --report "$RUNNER_TEMP/pack-reports/$id.xml" --report-format junit
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-test-reports
          path: ${{ runner.temp }}/pack-reports
          if-no-files-found: ignore
          retention-days: 7
      - run: dotnet format Bower.sln --verify-no-changes --no-restore

  windows-event-log:
    # The Windows Event Log reader only runs on Windows. Against the real event log
    # service: a dedicated test log and event source, allow-list filtering by the
    # service, restart from the bookmark and a cleared log. The platform-neutral
    # source and collector tests run here too. The variable makes a skip a failure.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore tests/Bower.UnitTests/Bower.UnitTests.csproj --locked-mode
      - run: dotnet build tests/Bower.UnitTests/Bower.UnitTests.csproj --configuration Release --no-restore
      - name: Windows Event Log tests
        env:
          BOWER_REQUIRE_WINDOWS_EVENTLOG_TESTS: "1"
        run: >
          dotnet test --project tests/Bower.UnitTests/Bower.UnitTests.csproj
          --configuration Release --no-build
          --filter-class "Bower.UnitTests.WindowsEventLog*"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled on the runner; Cargo.toml rust-version sets the floor.
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # C#-vs-Rust parity tests that need a built C# binary skip when it is absent.
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p bower-collector -p bower-cli
      - name: Test every pack with the Rust CLI
        run: |
          bower=target/release/bower
          "$bower" keys generate --out-dir "$RUNNER_TEMP/pack-keys" --name ci-ephemeral
          for source in ../packs/*/; do
            source=${source%/}
            id=$(basename "$source")
            "$bower" pack build "$source" --key "$RUNNER_TEMP/pack-keys/ci-ephemeral.key.pem" --out "$RUNNER_TEMP/packs/$id"
            "$bower" pack test "$RUNNER_TEMP/packs/$id/$id-"*.bowerpack --trusted-key "$RUNNER_TEMP/pack-keys/ci-ephemeral.pub.pem"
          done

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cfn-lint and Terraform providers are third-party code; keep the token out of .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Lint CloudFormation
        run: uvx cfn-lint==1.57.2 deploy/aws/*.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Validate GCP Terraform
        working-directory: deploy/gcp
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PowerShell 7 is preinstalled on ubuntu-latest; pin the test tooling versions.
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          foreach ($module in @(
            @{ Name = 'Pester'; RequiredVersion = '5.9.1'; SkipPublisherCheck = $true },
            @{ Name = 'PSScriptAnalyzer'; RequiredVersion = '1.25.0' }
          )) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module @module -Scope CurrentUser -Force -ErrorAction Stop
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Write-Warning "Download of $($module.Name) failed; retrying (attempt $attempt of 3)."
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }
      - name: Analyze and test PowerShell modules
        shell: pwsh
        run: pwsh -NoProfile -File powershell/build.ps1

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/Bower.Management.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/Bower.Management.Web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BOWER_AUTH_MODE: development

  e2e:
    needs: [build-test, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/Bower.Management.Web/package-lock.json
      - name: Build console (development auth) and management API
        run: |
          npm ci --ignore-scripts --prefix ui/Bower.Management.Web
          VITE_BOWER_AUTH_MODE=development npm run build --prefix ui/Bower.Management.Web
          # Native AOT publish (clang and zlib are preinstalled on ubuntu-latest).
          dotnet publish src/Bower.Management.Api/Bower.Management.Api.csproj -c Release -r linux-x64 -o out/management
          cp -R ui/Bower.Management.Web/dist out/management/wwwroot
      - name: Start management API with synthetic preview data
        run: |
          # Run from the publish folder so the content root (and wwwroot) resolves.
          cd out/management
          # Setup canaries go to the loopback stub collector Playwright starts (simulated only).
          printf 'e2e-canary-token' > "$RUNNER_TEMP/canary.token"
          ASPNETCORE_ENVIRONMENT=Development BOWER_AUTH_MODE=development \
            BOWER_MANAGEMENT_DB_PATH="$RUNNER_TEMP/management.db" \
            Bower__Setup__Canary__CollectorUrl=http://127.0.0.1:4399/ \
            Bower__Setup__Canary__IngestTokenFile="$RUNNER_TEMP/canary.token" \
            ./Bower.Management.Api > "$RUNNER_TEMP/management.log" 2>&1 &
          cd "$GITHUB_WORKSPACE"
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4320/health && break; sleep 1; done
          curl -sf http://127.0.0.1:4320/ | grep -q '<div id="root">'
          npm run seed:preview --prefix ui/Bower.Management.Web
      - run: npx --prefix ui/Bower.Management.Web playwright install --with-deps chromium
      - run: npx playwright test e2e/management.spec.ts
        working-directory: ui/Bower.Management.Web
        env:
          BOWER_E2E_CANARY: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/Bower.Management.Web/playwright-report
          retention-days: 7

  docker:
    needs: [build-test, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f deploy/docker/Dockerfile -t bower-collector:ci .
      - run: docker build -f deploy/docker/Dockerfile.management -t bower-management:ci --build-arg BOWER_AUTH_MODE=development .
      - run: docker build -f deploy/docker/Dockerfile.web -t bower-web:ci .
      - run: docker build -f deploy/docker/Dockerfile.sidecar -t bower-sidecar:ci .
      - run: docker build -f deploy/docker/Dockerfile.cloud -t bower-cloud:ci .
      - run: docker build -f rust/Dockerfile -t bower-collector-rs:ci .
      - name: Enrol the C# and Rust collectors with one-time tokens (compose e2e)
        run: bash tests/e2e/enrolment.sh
      - name: Relay mode across C# and Rust relays and downstreams (compose e2e)
        run: bash tests/e2e/relay.sh
      - name: Smoke-test cloud agent fails closed without a source
        run: |
          set +e
          docker run --rm --read-only --cap-drop ALL bower-cloud:ci
          test "$?" = 1
      - name: Smoke-test console image
        run: |
          docker network create bower-ci
          docker run -d --name bower-web --network bower-ci --read-only --tmpfs /tmp --cap-drop ALL \
            -e BOWER_API_UPSTREAM=http://bower-management:4320 -e BOWER_AUTH_MODE=development bower-web:ci
          sleep 3
          docker run --rm --network bower-ci curlimages/curl:8.11.1 -sf http://bower-web:8080/healthz
          docker run --rm --network bower-ci curlimages/curl:8.11.1 -sf http://bower-web:8080/config.js | grep -q '"authMode": "development"'
          docker run --rm --network bower-ci curlimages/curl:8.11.1 -sf -o /dev/null http://bower-web:8080/jobs

  docker-arm64:
    # Images publishes linux/amd64 and linux/arm64 from an amd64 runner, so the AOT
    # build stage cross-compiles. Build every AOT image for arm64 here so a broken
    # cross toolchain fails the pull request instead of the post-merge publish.
    needs: [build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - deploy/docker/Dockerfile
          - deploy/docker/Dockerfile.management
          - deploy/docker/Dockerfile.sidecar
          - deploy/docker/Dockerfile.cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: >
          docker buildx build --platform linux/arm64
          --file ${{ matrix.dockerfile }}
          --build-arg BOWER_AUTH_MODE=development
          --output type=cacheonly .

  publish:
    needs: build-test
    # Native AOT cannot cross-compile to another OS, and cross-architecture links need
    # a target sysroot, so every RID builds on a native runner.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Bower.sln --locked-mode
      # Native AOT, self-contained (PublishAot in the project): one native binary per host.
      - run: >
          dotnet publish src/Bower.Cli/Bower.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --output artifacts/${{ matrix.rid }}/cli
      - run: >
          dotnet publish src/Bower.Collector/Bower.Collector.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --output artifacts/${{ matrix.rid }}/collector
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bower-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  # Native packages and installers (#112). They need the publish artefacts and take a
  # few minutes, so they run on pushes to main and on pull requests that touch
  # packaging, the systemd unit, the default policies or the collector.
  packaging-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          pattern='^(deploy/installers/|deploy/ansible/|deploy/systemd/|tests/installers/|src/Bower\.Collector/|policies/default/|\.github/workflows/ci\.yml$)'
          if grep -qE "$pattern" <<<"$files"; then run=true; else run=false; fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  package-linux:
    needs: [publish, packaging-changes]
    if: needs.packaging-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bower-linux-*
          path: artefacts
      - name: Install nfpm
        run: |
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$archive"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" nfpm
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Load the package signing key (skipped when the secret is not configured)
        env:
          GPG_KEY: ${{ secrets.BOWER_PACKAGE_GPG_KEY }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::notice::BOWER_PACKAGE_GPG_KEY is not configured: the deb and rpm packages are unsigned."
            exit 0
          fi
          umask 077
          printf '%s\n' "$GPG_KEY" >"$RUNNER_TEMP/package-signing.asc"
          echo "BOWER_GPG_KEY_FILE=$RUNNER_TEMP/package-signing.asc" >>"$GITHUB_ENV"
      - name: Build deb, rpm and offline bundles
        env:
          NFPM_PASSPHRASE: ${{ secrets.BOWER_PACKAGE_GPG_PASSPHRASE }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="0.1.0-dev.${RUN_NUMBER}"; fi
          deploy/installers/linux/build.sh artefacts/bower-linux-x64 amd64 "$version" dist
          deploy/installers/linux/build.sh artefacts/bower-linux-arm64 arm64 "$version" dist
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/package-signing.asc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bower-packages-linux
          path: dist

  package-windows:
    needs: [publish, packaging-changes]
    if: needs.packaging-changes.outputs.run == 'true'
    runs-on: windows-latest
    env:
      # WiX v5 (MS-RL). v6 and later need the Open Source Maintenance Fee EULA accepted
      # by a person; see docs/architecture/dependencies.md.
      WIX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bower-win-*
          path: artefacts
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version "$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Load the code-signing certificate (skipped when the secret is not configured)
        env:
          SIGNING_PFX: ${{ secrets.BOWER_WINDOWS_SIGNING_PFX }}
        run: |
          if (-not $env:SIGNING_PFX) {
            Write-Output '::notice::BOWER_WINDOWS_SIGNING_PFX is not configured: the MSI and executables are unsigned.'
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [System.IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_PFX))
          "BOWER_SIGN_PFX_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build MSI and offline bundles
        env:
          BOWER_SIGN_PFX_PASSWORD: ${{ secrets.BOWER_WINDOWS_SIGNING_PFX_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { "0.1.0-dev.$env:RUN_NUMBER" }
          foreach ($arch in 'x64', 'arm64') {
            ./deploy/installers/windows/build.ps1 -ArtefactDirectory "artefacts/bower-win-$arch" `
              -Architecture $arch -Version $version -OutputDirectory dist
          }
      - name: Remove the signing certificate
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'signing.pfx') -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bower-packages-windows
          path: dist

  install-linux:
    # Ubuntu (offline bundle and Ansible role, deb) on the runner and Rocky Linux 9
    # (offline bundle, rpm) in a systemd container, against a loopback management API.
    needs: [package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bower-packages-linux
          path: dist
      - name: Start the management API (development auth, loopback only)
        run: |
          dotnet restore src/Bower.Management.Api/Bower.Management.Api.csproj --locked-mode
          dotnet build src/Bower.Management.Api/Bower.Management.Api.csproj -c Release --no-restore -o "$RUNNER_TEMP/management"
          cd "$RUNNER_TEMP/management"
          ASPNETCORE_ENVIRONMENT=Development BOWER_AUTH_MODE=development \
            BOWER_MANAGEMENT_DB_PATH="$RUNNER_TEMP/management.db" \
            nohup dotnet Bower.Management.Api.dll >"$RUNNER_TEMP/management.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4320/health && break; sleep 1; done
          curl -sf http://127.0.0.1:4320/health
      - run: bash tests/installers/linux.sh dist

  install-windows:
    # Windows Server (windows-latest): the MSI through the offline installer under
    # Windows PowerShell 5.1, against a loopback management API.
    needs: [package-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bower-packages-windows
          path: dist
      - name: Start the management API (development auth, loopback only) and run the install test
        run: |
          dotnet restore src/Bower.Management.Api/Bower.Management.Api.csproj --locked-mode
          dotnet build src/Bower.Management.Api/Bower.Management.Api.csproj -c Release --no-restore -o "$env:RUNNER_TEMP/management"
          $env:ASPNETCORE_ENVIRONMENT = 'Development'
          $env:BOWER_AUTH_MODE = 'development'
          $env:BOWER_MANAGEMENT_DB_PATH = Join-Path $env:RUNNER_TEMP 'management.db'
          Start-Process -FilePath dotnet -ArgumentList 'Bower.Management.Api.dll' -WorkingDirectory "$env:RUNNER_TEMP/management" `
            -RedirectStandardOutput "$env:RUNNER_TEMP/management.log" -RedirectStandardError "$env:RUNNER_TEMP/management.err"
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:4320/health | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          Invoke-RestMethod http://127.0.0.1:4320/health | Out-Null
          # Same step: Windows runners stop a step's child processes when the step ends.
          ./tests/installers/windows.ps1 -PackagesDirectory dist
      - name: Service and installer diagnostics
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          # Recovery configuration is metadata only (the MSI sets no command).
          sc.exe qfailure Bower
          foreach ($provider in 'Service Control Manager', 'MsiInstaller', 'Bower.Collector', 'Application Error', '.NET Runtime') {
            Write-Output "== $provider"
            $log = if ($provider -eq 'Service Control Manager') { 'System' } else { 'Application' }
            try {
              Get-WinEvent -FilterHashtable @{ LogName = $log; ProviderName = $provider } -MaxEvents 10 -ErrorAction Stop |
                Format-List TimeCreated, Id, Message
            } catch { Write-Output "(none: $($_.Exception.Message))" }
          }
          # msiexec logs hold no secret values; show the failing action.
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter '*install*.log' | ForEach-Object {
            Write-Output "== $($_.Name)"
            Select-String -LiteralPath $_.FullName -Pattern 'Return value 3' -Context 30, 2 | Select-Object -First 1 | Out-String -Width 300
          }
