name: Dependabot auto-merge

on:
  # Dependabot PRs receive a read-only GITHUB_TOKEN on pull_request. This workflow
  # never checks out PR code, checks the pull request author ID, restricts auto-merge
  # to single-commit PRs (dependabot/fetch-metadata verifies only commits[0]), and
  # relies on dependabot/fetch-metadata to verify the PR author and commit signature.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.id == '49699333' && github.event.pull_request.commits == 1
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge for patch and grouped minor dev-dependency updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
           steps.metadata.outputs.dependency-type == 'direct:development' &&
           steps.metadata.outputs.dependency-group != '')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
