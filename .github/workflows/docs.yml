name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'tools/docs/**'
      - 'deploy/azure-webapp/**'
      - 'deploy/bicep/ama-syslog-dcr.bicep'
      - 'deploy/bicep/main.bicep'
      - 'deploy/docker/hosted/**'
      - 'deploy/kubernetes/deployment.yaml'
      - 'ui/Bower.Management.Web/src/components/glossary.json'
      - 'src/Bower.Cli/Commands/CliHelp.cs'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'tools/docs/**'
      - 'deploy/azure-webapp/**'
      - 'deploy/bicep/ama-syslog-dcr.bicep'
      - 'deploy/bicep/main.bicep'
      - 'deploy/docker/hosted/**'
      - 'deploy/kubernetes/deployment.yaml'
      - 'ui/Bower.Management.Web/src/components/glossary.json'
      - 'src/Bower.Cli/Commands/CliHelp.cs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Install documentation check tools
        run: |
          uv venv .venv-docs
          uv pip install --python .venv-docs/bin/python --require-hashes -r tools/docs/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            tools/docs/package-lock.json
      - name: Validate generated pages and tools
        run: |
          .venv-docs/bin/python tools/docs/generate_glossary.py --check
          .venv-docs/bin/python tools/docs/generate_cli_reference.py --check
          .venv-docs/bin/python -m unittest discover -s tools/docs/tests -p 'test_*.py'
      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run typecheck
          # Fails on any broken link, anchor, Markdown link or image.
          npm run build
      - name: Check links in the built site
        run: .venv-docs/bin/python tools/docs/check_links.py website/build
      - name: Browser and accessibility checks
        working-directory: tools/docs
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-evidence
          path: tools/docs/test-results/
          if-no-files-found: ignore
      - name: Upload Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and lint the Web App, Sentinel and AMA syslog templates
        run: |
          az bicep install --version v0.45.6
          for template in deploy/azure-webapp/main.bicep deploy/bicep/main.bicep deploy/bicep/ama-syslog-dcr.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
            # Lint exits non-zero only on errors; fail on any linter finding, warnings included.
            az bicep lint --file "$template" --diagnostics-format sarif > "$RUNNER_TEMP/bicep-lint.sarif"
            python3 - "$RUNNER_TEMP/bicep-lint.sarif" <<'PYTHON'
          import json, sys
          results = [r for run in json.load(open(sys.argv[1]))['runs'] for r in run.get('results', [])]
          for result in results:
              print(f"{result.get('level', 'warning')}: {result.get('ruleId')}: {result['message']['text']}")
          sys.exit(1 if results else 0)
          PYTHON
          done

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 45
    steps:
      # GitHub Pages occasionally stalls in `syncing_files` past the action's 10-minute
      # default (#207, run 42373708403); later runs of the same content succeed. Wait longer,
      # then retry once: the action cancels a timed-out deployment, so a retry is clean.
      - name: Deploy documentation
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: '1200000'
      - name: Retry the deployment once
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: '1200000'
      - name: Report the page URL
        id: deployment
        env:
          FIRST_URL: ${{ steps.first.outputs.page_url }}
          RETRY_URL: ${{ steps.retry.outputs.page_url }}
        run: echo "page_url=${RETRY_URL:-$FIRST_URL}" >> "$GITHUB_OUTPUT"
