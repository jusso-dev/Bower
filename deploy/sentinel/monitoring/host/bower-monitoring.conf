# Drop-in for bower.service: /etc/systemd/system/bower.service.d/10-monitoring.conf
# Restart after any exit, including a clean exit after a fatal worker fault, and keep trying
# with a bounded rate so a broken configuration does not spin. Reload: systemctl daemon-reload.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=20

[Service]
Restart=always
RestartSec=5s
