# Hardened read-only DaemonSet for allow-listed Kubernetes container security telemetry (#92).
# RBAC is strictly namespaced (Role, never ClusterRole) and limited to get/list pods in
# explicitly approved namespaces. Replace 'app-production' with each approved namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bower-node-reader
  namespace: bower-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bower-pod-metadata-reader
  namespace: app-production
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bower-pod-metadata-reader
  namespace: app-production
subjects:
  - kind: ServiceAccount
    name: bower-node-reader
    namespace: bower-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bower-pod-metadata-reader
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bower-node-collector
  namespace: bower-system
  labels:
    app.kubernetes.io/name: bower-node-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bower-node-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bower-node-collector
    spec:
      serviceAccountName: bower-node-reader
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/replace-me/bower:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: BOWER_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: BOWER_KUBERNETES_NAMESPACES
              value: app-production
            - name: BOWER_KUBERNETES_LABEL_SELECTORS
              value: bower.io/collect=true
            - name: BOWER_KUBERNETES_ALLOWED_LABELS
              value: app.kubernetes.io/name,app.kubernetes.io/component
            - name: BOWER_QUEUE_PATH
              value: /var/lib/bower/queue.db
            - name: BOWER_POLICY_DIRECTORY
              value: /app/policies/default
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/lib/bower
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/bower
            type: DirectoryOrCreate
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
