apiVersion: apps/v1
kind: Deployment
metadata:
  name: bower-collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bower-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bower-collector
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: bower-collector
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/replace-me/bower:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 4319
          env:
            - name: BOWER_LISTEN_URL
              value: https://0.0.0.0:4319
            - name: BOWER_INGEST_TOKEN_FILE
              value: /var/run/secrets/bower/ingest-token
            - name: BOWER_PRODUCER_SCOPES_FILE
              value: /etc/bower/producer-scopes/scopes.json
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: /var/run/secrets/bower-tls/tls.crt
            - name: ASPNETCORE_Kestrel__Certificates__Default__KeyPath
              value: /var/run/secrets/bower-tls/tls.key
            - name: BOWER_AZURE_CREDENTIAL
              value: workload-identity
            - name: BOWER_QUEUE_PATH
              value: /var/lib/bower/queue.db
            # BOWER_COLLECTOR_ID is optional: without it the first start persists the pod name
            # to /var/lib/bower/collector-id on the PVC and later pods reuse it. Set it
            # explicitly (unique per collector) to choose the id.
            # Size the cap below the PVC: settling a full backlog can grow the database to
            # 1.75 x (cap + 4 MiB) = 8.8 GiB here, and free space must stay above the warning
            # watermark (max(1 GiB, 10%)) after the ext4 reserve (5%) and metadata (~2%).
            # That needs about 10.7 GiB; the 16Gi claim below leaves room. On a 10Gi claim
            # use 4294967296 (4 GiB). See docs/production-readiness/03-storage-pressure.md.
            - name: BOWER_QUEUE_MAX_BYTES
              value: "5368709120"
            - name: BOWER_POLICY_DIRECTORY
              value: /app/policies/default
            - name: BOWER_OUTPUT
              value: azure-logs-ingestion
            - name: BOWER_DCE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: bower-azure
                  key: dceEndpoint
            - name: BOWER_DCR_ID
              valueFrom:
                configMapKeyRef:
                  name: bower-azure
                  key: dcrImmutableId
            - name: BOWER_STREAM_NAME
              value: Custom-BowerSecurity
          volumeMounts:
            - name: data
              mountPath: /var/lib/bower
            - name: ingest-token
              mountPath: /var/run/secrets/bower
              readOnly: true
            - name: producer-scopes
              mountPath: /etc/bower/producer-scopes
              readOnly: true
            - name: tls
              mountPath: /var/run/secrets/bower-tls
              readOnly: true
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
          # Liveness avoids queue reads so a busy database cannot restart a healthy process.
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              # Container logs only: the root file system is read-only and the queue is on the PVC.
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bower-data
        # Provision the token through the cluster's approved secret-management process.
        - name: ingest-token
          secret:
            secretName: bower-ingest
            defaultMode: 0440
        - name: producer-scopes
          configMap:
            name: bower-producer-scopes
        - name: tls
          secret:
            secretName: bower-intake-tls
            defaultMode: 0440
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bower-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 16Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bower-collector
  annotations:
    azure.workload.identity/client-id: replace-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bower-producer-scopes
data:
  # Default deny: replace with exact, reviewed producer identity tuples.
  scopes.json: '[]'
---
apiVersion: v1
kind: Service
metadata:
  name: bower-collector
spec:
  selector:
    app.kubernetes.io/name: bower-collector
  ports:
    - name: https
      port: 4319
      targetPort: https
---
# Only labelled producer pods in this namespace may reach the collector. Egress
# permits DNS and HTTPS (including Entra ID and Azure Monitor ingestion).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bower-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bower-collector
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              bower.io/producer: "true"
      ports:
        - protocol: TCP
          port: 4319
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
