services:
  bower:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4319:4319"
    environment:
      # The container listens on 0.0.0.0, so producers must authenticate.
      # Generate one with: dotnet run --project src/Bower.Cli -- token generate
      BOWER_INGEST_TOKEN: ${BOWER_INGEST_TOKEN:?set BOWER_INGEST_TOKEN}
      BOWER_OUTPUT: ama-spool
      BOWER_AMA_SPOOL_PATH: /var/spool/bower
    volumes:
      - bower-data:/var/lib/bower
      - bower-spool:/var/spool/bower
    tmpfs:
      - /tmp:size=16m,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bower-data:
  bower-spool:
