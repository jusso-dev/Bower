apiVersion: bower.security/v1
kind: TelemetryPolicy
metadata:
  id: BWR-POL-ROLE-MEMBERSHIP
  name: Role membership changes
  version: 1.0.0
  owner: Security Operations
  reviewDate: 2027-01-01
match:
  eventCategories: [identity-management]
  eventTypes: [role_membership_changed]
  eventActions: [role.add, role.remove]
  eventResults: [success]
requirements:
  requiredFields:
    - timeGenerated
    - eventType
    - eventResult
    - application.name
    - actor.userId
    - target.id
    - change.field
    - request.correlationId
  atLeastOne:
    - change.previousValue
    - change.newValue
decision:
  action: accept
  minimumValueScore: 70
  neverSample: true
routing:
  profile: application-security
  destination: security-events
