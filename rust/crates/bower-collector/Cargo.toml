[package]
name = "bower-collector"
description = "Bower local HTTP collector host: authenticated ingest, durable queue delivery and maintenance jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bower-collector"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
bower-contracts.workspace = true
bower-core.workspace = true
bower-integrity.workspace = true
bower-output-ama-spool.workspace = true
bower-output-azure.workspace = true
bower-packs.workspace = true
bower-pipeline.workspace = true
bower-persistence.workspace = true
bower-policy.workspace = true
bower-redaction.workspace = true
bower-source-syslog.workspace = true
chrono.workspace = true
hex.workspace = true
http-body-util = { workspace = true, features = ["channel"] }
hyper.workspace = true
hyper-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
bower-evidence.workspace = true
flate2.workspace = true
rusqlite.workspace = true
chrono.workspace = true
# TLS server for the management proxy and CA bundle tests (as in bower-output-azure).
rustls.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
