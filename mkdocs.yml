site_name: Bower
site_description: Security telemetry, from source to proof. Self-hosted collection, privacy and verified Microsoft Sentinel delivery.
site_url: https://jusso-dev.github.io/Bower/
repo_url: https://github.com/jusso-dev/Bower
repo_name: jusso-dev/Bower
edit_uri: edit/main/docs/
copyright: Bower · Self-hosted security telemetry
strict: true
docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  research/
theme:
  name: material
  custom_dir: docs-site/overrides
  language: en
  font: false
  logo: assets/bower-mark.svg
  favicon: assets/bower-mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
plugins:
  - search
hooks:
  - tools/docs/hooks.py
extra:
  generator: false
extra_css:
  - assets/styles/bower.css
extra_javascript:
  - assets/scripts/flow.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Start here:
      - getting-started/index.md
      - Your first verified event: getting-started/first-event.md
      - Concepts: getting-started/concepts.md
      - Choose a deployment: getting-started/deployment.md
      - FAQ: getting-started/faq.md
  - Guides:
      - guides/index.md
      - Dashboard:
          - Set up Bower: operations/console-onboarding.md
          - Home: operations/console-home.md
          - Fleet: operations/console-fleet.md
          - Sources: operations/console-sources.md
          - Privacy editor: operations/console-privacy-editor.md
          - Simple view: operations/console-simple-view.md
          - Help and checklist: operations/console-help.md
      - Installation:
          - Linux and Windows packages: deployment/installers.md
          - Management console: deployment/console-image.md
          - Container images: deployment/container-images.md
          - Docker sidecar: deployment/docker-sidecar.md
          - Hosted collectors: deployment/hosted-collectors.md
          - Azure Functions: deployment/azure-function.md
          - AWS: deployment/aws.md
          - AWS Lambda: deployment/aws-lambda.md
          - Google Cloud: deployment/gcp.md
          - Relay networks: deployment/relay.md
          - Amazon S3 output: deployment/s3-output.md
          - Splunk HEC and NDJSON output: deployment/http-splunk-hec-output.md
